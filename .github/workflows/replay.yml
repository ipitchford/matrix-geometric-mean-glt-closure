# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  quick:
    name: Exact checks (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: verify_exact.py with and without -O (every check raises on failure)
        run: |
          python -I -B -O verify_exact.py "$RUNNER_TEMP/results_O.json"
          python -I -B verify_exact.py "$RUNNER_TEMP/results.json"
      - name: Compare with the shipped verification_results.json (timing and platform fields ignored)
        run: |
          python -I -B - "$RUNNER_TEMP/results_O.json" "$RUNNER_TEMP/results.json" verification_results.json <<'EOF'
          import json, sys
          ign = {"python", "optimisation_flag", "seconds"}
          strip = lambda d: {k: v for k, v in d.items() if k not in ign}
          ref = strip(json.load(open(sys.argv[3])))
          for p in sys.argv[1:3]:
              new = json.load(open(p))
              if new["status"] != "PASS" or strip(new) != ref:
                  sys.exit(f"mismatch: {p}")
          print("identical apart from timing/platform fields")
          EOF
      - name: Mutation self-test (a corrupted formula must be detected, also under -O)
        run: |
          python -I -B -O verify_exact.py --self-test-mutation
          python -I -B verify_exact.py --self-test-mutation
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
  figures:
    name: Figures (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: make_figures.py (PNG bytes compared; PDF bytes embed timestamps)
        run: |
          O="$RUNNER_TEMP/figs"; mkdir -p "$O"
          python -I -B make_figures.py "$O"
          for f in fig1_mean_collapse.png figA1_spectral_envelope.png; do cmp "$O/$f" "$f" || echo "PNG bytes differ on this platform: $f"; done
